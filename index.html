<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Bhakti 🌼</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Quicksand:wght@400;600&display=swap">
<style>
:root{
  --butter:#fff1b8; --honey:#ffd86b; --amber:#f2a93b; --cocoa:#7a4a1d; --cream:#fffaf0; --blush:#f7b6c2;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; min-height:100svh; color:var(--cocoa);
  font-family:'Quicksand',system-ui,sans-serif;
  background:
    radial-gradient(60% 40% at 20% 10%, #fff8d6 0%, transparent 70%),
    radial-gradient(50% 40% at 85% 85%, #ffe9a0 0%, transparent 70%),
    linear-gradient(165deg,#fff3c0 0%,#ffe08a 55%,#ffd36b 100%);
  background-color:#ffe08a; overflow-x:hidden;
}
#petals{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:1}
main{position:relative; z-index:2; min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 18px 40px; text-align:center}
h1{font-family:'Caveat',cursive,serif; font-weight:700; font-size:clamp(2.2rem,9vw,3.4rem); margin:0; line-height:1.05; transition:opacity .8s ease, max-height .8s ease; max-height:120px; overflow:hidden}
.hint{margin:6px 0 0; font-size:1rem; letter-spacing:.02em; opacity:.85; animation:pulse 2.2s ease-in-out infinite; transition:opacity .5s ease}
@keyframes pulse{50%{transform:translateY(-3px); opacity:.55}}

/* cake */
.cake-wrap{width:min(78vw,320px); transition:width 1.1s cubic-bezier(.22,.8,.3,1); margin-top:6px}
button.cake{all:unset; display:block; width:100%; cursor:pointer; -webkit-tap-highlight-color:transparent; border-radius:24px}
button.cake:focus-visible{outline:3px dashed var(--cocoa); outline-offset:6px}
.cake svg{width:100%; height:auto; display:block; overflow:visible; filter:drop-shadow(0 14px 18px rgba(122,74,29,.22)); transition:transform .4s ease}
.cake:active svg{transform:scale(.97)}
.flame{transform-box:fill-box; transform-origin:50% 100%; animation:flicker 1.1s ease-in-out infinite; transition:opacity .35s ease, transform .35s ease}
@keyframes flicker{0%,100%{transform:scale(1,1) rotate(-2deg)}50%{transform:scale(.92,1.08) rotate(2deg)}}
.glow{transition:opacity .4s ease; animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{opacity:.55}}
.smoke{opacity:0; stroke-dasharray:60; stroke-dashoffset:60}
.out .flame{opacity:0; transform:scale(.1); animation:none}
.out .glow{opacity:0; animation:none}
.out .smoke{animation:smoke 2.4s ease-out forwards}
@keyframes smoke{0%{opacity:0; stroke-dashoffset:60; transform:translateY(0)}20%{opacity:.7}100%{opacity:0; stroke-dashoffset:0; transform:translateY(-26px)}}
.out ~ .hint, .done .hint{opacity:0}

/* reveal blocks */
.reveal{max-height:0; opacity:0; overflow:hidden; transform:translateY(18px) scale(.94); transition:max-height 1s ease, opacity .9s ease, transform 1s cubic-bezier(.34,1.4,.64,1)}
.show.reveal{opacity:1; transform:none}
.wish.show{max-height:260px}
.vinyl-box.show{max-height:210px}
.frame-box.show{max-height:640px}
.wish{margin-top:14px}
.wish-card{background:rgba(255,250,240,.72); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,.7); border-radius:26px; padding:18px 22px; max-width:340px; box-shadow:0 10px 30px rgba(190,130,30,.18)}
.wish-card h2{font-family:'Caveat',cursive; font-size:2.1rem; margin:0 0 4px}
.wish-card p{margin:0; line-height:1.55; font-size:.98rem}

/* vinyl */
.vinyl-box{margin-top:18px; padding:6px}
.vinyl{--v:min(34vw,120px); width:var(--v); height:var(--v); border-radius:50%; position:relative; margin:0 auto;
  background:
    radial-gradient(circle, transparent 0 33%, rgba(255,255,255,0) 33%),
    conic-gradient(from 20deg, rgba(255,255,255,.14), transparent 18%, rgba(255,255,255,.1) 50%, transparent 68%, rgba(255,255,255,.14)),
    repeating-radial-gradient(circle, #1d1a17 0 2px, #2c2722 3px 4px);
  box-shadow:0 16px 30px rgba(90,50,10,.35), 0 0 0 6px rgba(255,250,240,.55);
  animation:spin 5s linear infinite; animation-play-state:paused}
.vinyl.spin{animation-play-state:running}
.vinyl.paused{animation-play-state:paused}
@keyframes spin{to{transform:rotate(360deg)}}
.label{position:absolute; inset:21%; border-radius:50%; background:var(--honey) center/cover no-repeat; box-shadow:0 0 0 4px #f6cf6a, inset 0 0 12px rgba(0,0,0,.2); display:grid; place-items:center; font-size:2rem; overflow:hidden}
.hole{position:absolute; inset:47.5%; border-radius:50%; background:var(--butter); box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
.now{margin:12px 0 0; font-family:'Caveat',cursive; font-size:1.4rem}

.frame-box{margin-top:26px; padding:14px 8px}
.frame{width:min(84vw,340px); margin:0 auto; padding:16px 16px 20px; background:#fffaf0; border-radius:10px; box-shadow:0 18px 36px rgba(122,74,29,.28), 0 0 0 5px #e9b957, 0 0 0 9px #f6d58e; transform:rotate(-1.5deg); position:relative}
.frame::before{content:''; position:absolute; top:-18px; left:50%; width:90px; height:28px; transform:translateX(-50%) rotate(2deg); background:rgba(247,182,194,.75); border-radius:3px}
.photo{aspect-ratio:4/5; border-radius:6px; background:linear-gradient(160deg,#ffe9a0,#ffd1dc) center/cover no-repeat; display:grid; place-items:center; font-size:3rem; box-shadow:inset 0 0 0 1px rgba(122,74,29,.15)}
.cap{font-family:'Caveat',cursive; font-size:1.7rem; margin:12px 0 0}
#mute{position:fixed; top:calc(env(safe-area-inset-top,0px) + 12px); right:14px; z-index:5; width:44px; height:44px; border-radius:50%; border:0; background:rgba(255,250,240,.8); font-size:1.2rem; cursor:pointer; box-shadow:0 4px 12px rgba(122,74,29,.2); opacity:0; pointer-events:none; transition:opacity .6s ease}
#mute.on{opacity:1; pointer-events:auto}
#edit{position:fixed; left:12px; bottom:calc(env(safe-area-inset-bottom,0px) + 12px); z-index:6; background:rgba(255,250,240,.92); border-radius:16px; padding:10px 12px; font-size:.8rem; display:none; gap:6px; flex-direction:column; box-shadow:0 6px 18px rgba(0,0,0,.15)}
#edit.on{display:flex}
@media (prefers-reduced-motion:reduce){.vinyl{animation-duration:12s}.hint{animation:none}}
</style>
</head>
<body>
<canvas id="petals" aria-hidden="true"></canvas>
<button id="mute" aria-label="Pause or play music">🎵</button>

<main id="stage">
  <h1 id="title">Hey Bhakti 🌼</h1>
  <p class="hint" id="hint"></p>

  <div class="cake-wrap" id="cakeWrap">
    <button class="cake" id="cake" aria-label="Blow out the candle">
      <svg viewBox="0 0 300 280" role="img" aria-hidden="true">
        <ellipse cx="150" cy="250" rx="128" ry="20" fill="#e8bf72"/>
        <ellipse cx="150" cy="243" rx="122" ry="17" fill="#fff6e0"/>
        <rect x="58" y="168" width="184" height="76" rx="16" fill="#f6cd7f"/>
        <path d="M56 180Q56 160 78 160H222Q244 160 244 180V186Q244 198 234 198Q224 198 224 186V182Q224 174 214 174Q204 174 204 184V194Q204 206 192 206Q180 206 180 194V186Q180 178 170 178Q160 178 160 186V190Q160 200 150 200Q140 200 140 190V184Q140 174 128 174Q116 174 116 184V192Q116 202 104 202Q92 202 92 192V186Q92 178 82 178Q72 178 72 188Q72 196 64 196Q56 196 56 186Z" fill="#fff6e0"/>
        <g fill="#f7b6c2"><circle cx="86" cy="224" r="5"/><circle cx="118" cy="232" r="4"/><circle cx="150" cy="224" r="5"/><circle cx="182" cy="232" r="4"/><circle cx="214" cy="224" r="5"/></g>
        <g fill="#fff6e0"><circle cx="86" cy="224" r="1.8"/><circle cx="150" cy="224" r="1.8"/><circle cx="214" cy="224" r="1.8"/></g>
        <rect x="94" y="108" width="112" height="56" rx="14" fill="#fadf9c"/>
        <path d="M92 124Q92 106 112 106H188Q208 106 208 124V128Q208 138 200 138Q192 138 192 128Q192 120 184 120Q176 120 176 130V136Q176 146 166 146Q156 146 156 136V128Q156 120 148 120Q138 120 138 130V134Q138 142 130 142Q122 142 122 134V128Q122 120 114 120Q106 120 106 128V130Q106 138 98 138Q92 138 92 130Z" fill="#fff6e0"/>
        <circle cx="112" cy="104" r="7" fill="#e0525e"/><circle cx="188" cy="104" r="7" fill="#e0525e"/>
        <circle cx="110" cy="101.5" r="2" fill="#fff" opacity=".7"/><circle cx="186" cy="101.5" r="2" fill="#fff" opacity=".7"/>
        <path d="M112 97q-2-8 4-12M188 97q2-8-4-12" stroke="#6b8f3a" stroke-width="2" fill="none" stroke-linecap="round"/>
        <rect x="144" y="68" width="12" height="40" rx="3" fill="#f7b6c2"/>
        <path d="M144 80l12-6M144 92l12-6M144 104l12-6" stroke="#fff6e0" stroke-width="3" opacity=".8"/>
        <path d="M150 68v-6" stroke="#5a3a1a" stroke-width="2" stroke-linecap="round"/>
        <circle class="glow" cx="150" cy="52" r="26" fill="#ffd36b" opacity=".35"/>
        <g class="flame"><ellipse cx="150" cy="52" rx="8" ry="14" fill="#ffab1a"/><ellipse cx="150" cy="55" rx="4" ry="8" fill="#fff3b0"/></g>
        <path class="smoke" d="M150 60c-8-8 8-14 0-24s8-14 2-22" stroke="#b49a78" stroke-width="3" fill="none" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <section class="vinyl-box reveal" id="vinylBox">
    <div class="vinyl" id="vinyl"><div class="label" id="label"></div><div class="hole"></div></div>
    <p class="now">now playing: a song for you ♪</p>
  </section>

  <section class="wish reveal" id="wish">
    <div class="wish-card">
      <h2>Happy Birthday, Bhakti! 🎂</h2>
      <p>May your life bloom softly and beautifully, with warm mornings, sweet surprises and people who adore you. Keep shining like sunshine. 🌼</p>
    </div>
  </section>

  <section class="frame-box reveal" id="frameBox">
    <div class="frame"><div class="photo" id="photo"></div><p class="cap">for Bhakti, with love 💛</p></div>
  </section>
</main>

<div id="edit">
  <b>Preview setup</b>
  <label>Photo <input type="file" id="pickImg" accept="image/*"></label>
  <label>Song <input type="file" id="pickAudio" accept="audio/*"></label>
</div>

<script>
/* ===== Easy settings ===== */
const IMAGE_SRC = "images (2).jpg";   // small photo on the vinyl centre (data URI)
const FRAME_SRC = "Bhakti.jpg";   // big photo in the frame (data URI); falls back to IMAGE_SRC
const AUDIO_SRC = "JB.mp3";   // custom song (data URI). Empty = built-in music-box Happy Birthday

/* ===== Elements ===== */
const $ = id => document.getElementById(id);
const cake = $('cake'), cakeWrap = $('cakeWrap'), vinyl = $('vinyl'), mute = $('mute');
let audioEl = null, ctx = null, master = null, timer = null, nextStart = 0, playing = false, started = false;

function setPhoto(src){ if(src){ $('label').style.backgroundImage = 'url("'+src+'")'; $('label').textContent = ''; } }
function setFrame(src){ if(src){ $('photo').style.backgroundImage = 'url("'+src+'")'; $('photo').textContent = ''; } }
setPhoto(IMAGE_SRC); setFrame(FRAME_SRC || IMAGE_SRC);

/* ===== Music ===== */
const TUNE = [[392,.75],[392,.25],[440,1],[392,1],[523.25,1],[493.88,2],
 [392,.75],[392,.25],[440,1],[392,1],[587.33,1],[523.25,2],
 [392,.75],[392,.25],[783.99,1],[659.25,1],[523.25,1],[493.88,1],[440,1],
 [698.46,.75],[698.46,.25],[659.25,1],[523.25,1],[587.33,1],[523.25,2]];
const BEAT = .55;
function note(f,t){
  [[f,'triangle',.5],[f*2,'sine',.18]].forEach(([fr,type,vol])=>{
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = fr;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.001,t+1.3);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+1.4);
  });
}
function playTune(t0){
  let t = t0;
  TUNE.forEach(([f,b])=>{ note(f,t); t += b*BEAT; });
  nextStart = t + 2.2;
}
function startSynth(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  ctx = new AC(); master = ctx.createGain(); master.gain.value = .4;
  const d = ctx.createDelay(); d.delayTime.value = .28; const fb = ctx.createGain(); fb.gain.value = .3;
  master.connect(ctx.destination); master.connect(d); d.connect(fb); fb.connect(d); d.connect(ctx.destination);
  playTune(ctx.currentTime + .1);
  timer = setInterval(()=>{ if(ctx.state==='running' && ctx.currentTime + 1 > nextStart) playTune(nextStart); }, 400);
}
function startMusic(){
  if(started) return; started = true;
  const src = window.__song || AUDIO_SRC;
  if(src){ audioEl = new Audio(src); audioEl.loop = true; audioEl.play().catch(()=>{}); }
  else startSynth();
  playing = true; mute.classList.add('on');
}
function toggleMusic(){
  if(!started) return;
  if(playing){ audioEl ? audioEl.pause() : ctx.suspend(); vinyl.classList.add('paused'); }
  else { audioEl ? audioEl.play() : ctx.resume(); vinyl.classList.remove('paused'); }
  playing = !playing; mute.textContent = playing ? '🎵' : '🔇';
}
mute.addEventListener('click', toggleMusic);

/* ===== The tap ===== */
let tapped = false;
cake.addEventListener('click', ()=>{
  if(tapped) return; tapped = true;
  startMusic();                                   // inside the tap so the browser allows sound
  cake.classList.add('out');
  $('hint').style.opacity = 0;
  const reveal = (id,ms,cb)=>setTimeout(()=>{ const el=$(id); el.classList.add('show'); if(cb) cb(); setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'center'}),700); },ms);
  setTimeout(()=>{ cakeWrap.style.width = 'min(40vw,150px)'; $('title').style.opacity = 0; $('title').style.maxHeight = 0; }, 900);
  reveal('vinylBox',1300,()=>vinyl.classList.add('spin'));
  reveal('wish',3000);
  reveal('frameBox',4800);
});

/* ===== Blossom petals ===== */
const cv = $('petals'), c = cv.getContext('2d');
let W, H, DPR = Math.min(window.devicePixelRatio||1, 2), petals = [];
const COLORS = ['#ffd1dc','#ffc0cf','#ffe3ea','#f9a8bd','#fff0f3'];
function size(){ W = innerWidth; H = innerHeight; cv.width = W*DPR; cv.height = H*DPR; c.setTransform(DPR,0,0,DPR,0,0); }
function mk(initial){
  return { x:Math.random()*W, y: initial ? Math.random()*H : -20, s:7+Math.random()*9, vy:.5+Math.random()*.9,
    sw:Math.random()*Math.PI*2, swS:.01+Math.random()*.02, amp:.4+Math.random()*.8, r:Math.random()*6.28, vr:(Math.random()-.5)*.03,
    f:Math.random()*6.28, vf:.02+Math.random()*.03, col:COLORS[(Math.random()*COLORS.length)|0], a:.55+Math.random()*.4 };
}
function init(){ size(); const n = matchMedia('(prefers-reduced-motion:reduce)').matches ? 14 : (W<600 ? 26 : 44); petals = Array.from({length:n},()=>mk(true)); }
function draw(p){
  c.save(); c.translate(p.x,p.y); c.rotate(p.r); c.scale(Math.cos(p.f)*.8+.2, 1);
  c.globalAlpha = p.a; c.fillStyle = p.col; const s = p.s;
  c.beginPath(); c.moveTo(0,-s); c.bezierCurveTo(s*.95,-s*.6,s*.7,s*.7,0,s); c.bezierCurveTo(-s*.7,s*.7,-s*.95,-s*.6,0,-s); c.fill();
  c.globalAlpha = p.a*.5; c.fillStyle = '#f07c99'; c.beginPath(); c.arc(0,s*.7,s*.12,0,6.28); c.fill();
  c.restore();
}
function tick(){
  c.clearRect(0,0,W,H);
  petals.forEach((p,i)=>{
    p.sw += p.swS; p.x += Math.sin(p.sw)*p.amp + .15; p.y += p.vy; p.r += p.vr; p.f += p.vf;
    if(p.y > H+20 || p.x > W+30){ petals[i] = mk(false); }
    draw(p);
  });
  requestAnimationFrame(tick);
}
addEventListener('resize', size); init(); tick();

/* ===== Owner preview: open this page with #edit to try a photo / song ===== */
if(location.hash === '#edit'){
  $('edit').classList.add('on');
  $('pickImg').onchange = e => { const f = e.target.files[0]; if(f){ const u = URL.createObjectURL(f); setPhoto(u); setFrame(u); } };
  $('pickAudio').onchange = e => { const f = e.target.files[0]; if(f) window.__song = URL.createObjectURL(f); };
}
</script>
</body>
</html>
